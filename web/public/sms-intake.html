<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Check-In SMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body, button, input, textarea, select { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>
</head>
<body class="bg-[#f9f8f6]">
  <div class="flex flex-col h-screen max-w-2xl mx-auto bg-white">
    <!-- Header -->
    <div class="bg-white border-b border-[#e5e7eb] px-6 py-4">
      <div class="flex items-center justify-between mb-3">
        <h1 class="text-2xl font-bold text-[#1f2937]">Healthcare Intake SMS</h1>
        <a href="/landing-intake.html" class="text-sm text-[#6b7280] hover:text-[#1f2937]">← Back</a>
      </div>
      <p class="text-sm text-[#6b7280]">Appointment confirmation conversation</p>
    </div>

    <!-- Messages Container - Clean SMS Style -->
    <div id="messagesContainer" class="flex-1 overflow-auto p-4 space-y-2 bg-[#ffffff]">
      <!-- Initial greeting will be inserted here -->
      <div id="initialMessage" class="flex justify-start">
        <div class="bg-[#e5e7eb] text-[#1f2937] px-4 py-2 rounded-2xl text-sm leading-relaxed max-w-xs">
          Loading...
        </div>
      </div>
    </div>

    <!-- Input Section -->
    <div class="border-t border-[#e5e7eb] bg-white px-4 py-3">
      <div class="flex gap-2">
        <input
          id="messageInput"
          type="text"
          placeholder="Type message..."
          class="flex-1 px-4 py-2 border border-[#e5e7eb] rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-[#2563eb]"
        />
        <button
          id="sendBtn"
          class="px-5 py-2 bg-[#2563eb] text-white rounded-full font-medium hover:bg-[#1d4ed8] transition text-sm"
        >
          Send
        </button>
      </div>
    </div>

    <!-- Footer -->
    <div class="px-4 py-2 bg-[#f0f4f8] border-t border-[#d1d5db] text-xs text-[#6b7280] text-center">
      HIPAA-Protected • Secure End-to-End
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const ledgerId = params.get('ledgerId');
    let conversationStep = 1;

    if (!ledgerId) {
      document.getElementById('messagesContainer').innerHTML = '<div class="p-4 text-center text-red-600">Error: No ledgerId provided</div>';
    }

    // Load initial greeting
    async function loadInitialGreeting() {
      try {
        const response = await fetch('/api/sms/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ledgerId }),
        });

        if (response.ok) {
          const data = await response.json();
          const initialMessage = document.getElementById('initialMessage');
          if (initialMessage) {
            initialMessage.innerHTML = `<div class="bg-[#e5e7eb] text-[#1f2937] px-4 py-2 rounded-2xl text-sm leading-relaxed max-w-xs">${escapeHtml(data.greeting)}</div>`;
          }
        }
      } catch (err) {
        console.error('Error:', err);
      }
    }

    window.addEventListener('load', loadInitialGreeting);

    // Send message
    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    document.getElementById('messageInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const message = input.value.trim();
      if (!message) return;

      const container = document.getElementById('messagesContainer');

      // Show patient message (right-aligned, blue)
      const patientDiv = document.createElement('div');
      patientDiv.className = 'flex justify-end';
      patientDiv.innerHTML = `<div class="bg-[#2563eb] text-white px-4 py-2 rounded-2xl text-sm max-w-xs">${escapeHtml(message)}</div>`;
      container.appendChild(patientDiv);

      input.value = '';
      input.disabled = true;
      document.getElementById('sendBtn').disabled = true;

      // Show loading indicator (left-aligned, gray)
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'flex justify-start';
      loadingDiv.innerHTML = `<div class="bg-[#e5e7eb] text-[#1f2937] px-4 py-2 rounded-2xl text-sm">Typing...</div>`;
      container.appendChild(loadingDiv);
      container.scrollTop = container.scrollHeight;

      try {
        const response = await fetch('/api/sms/message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            ledgerId,
            message,
            phoneNumber: 'demo-patient',
          }),
        });

        loadingDiv.remove();

        if (response.ok) {
          const data = await response.json();

          // Show AI response (left-aligned, gray)
          const aiDiv = document.createElement('div');
          aiDiv.className = 'flex justify-start';
          aiDiv.innerHTML = `<div class="bg-[#e5e7eb] text-[#1f2937] px-4 py-2 rounded-2xl text-sm leading-relaxed max-w-xs">${escapeHtml(data.aiResponse)}</div>`;
          container.appendChild(aiDiv);

          conversationStep++;
          container.scrollTop = container.scrollHeight;
        } else {
          loadingDiv.remove();
          const errorDiv = document.createElement('div');
          errorDiv.className = 'flex justify-start';
          errorDiv.innerHTML = `<div class="bg-[#fef2f2] text-[#991b1b] px-4 py-2 rounded-2xl text-sm">Error. Please try again.</div>`;
          container.appendChild(errorDiv);
        }
      } catch (err) {
        loadingDiv.remove();
        const errorDiv = document.createElement('div');
        errorDiv.className = 'flex justify-start';
        errorDiv.innerHTML = `<div class="bg-[#fef2f2] text-[#991b1b] px-4 py-2 rounded-2xl text-sm">Error: ${err.message}</div>`;
        container.appendChild(errorDiv);
      } finally {
        input.disabled = false;
        document.getElementById('sendBtn').disabled = false;
        input.focus();
        container.scrollTop = container.scrollHeight;
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
