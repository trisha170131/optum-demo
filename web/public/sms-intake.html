<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Check-In SMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body, button, input, textarea, select { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>
</head>
<body class="bg-[#f9f8f6]">
  <div class="flex flex-col h-screen max-w-2xl mx-auto bg-white">
    <!-- Header -->
    <div class="bg-white border-b border-[#e5e7eb] px-6 py-4">
      <div class="flex items-center justify-between mb-3">
        <h1 class="text-2xl font-bold text-[#1f2937]">Two-Way AI SMS Intake</h1>
        <a href="/landing-intake.html" class="text-sm text-[#6b7280] hover:text-[#1f2937]">← Back</a>
      </div>
      <p class="text-sm text-[#6b7280]">Secure healthcare appointment confirmation</p>
    </div>

    <!-- Messages -->
    <div id="messagesContainer" class="flex-1 overflow-auto p-6 space-y-4">
      <!-- Initial greeting label -->
      <div class="text-xs font-semibold text-[#9ca3af] uppercase tracking-wide">Initial Greeting</div>

      <!-- AI initial message -->
      <div id="initialMessage" class="flex justify-start">
        <div class="max-w-2xl bg-[#f3f4f6] text-[#1f2937] px-5 py-3 rounded-lg text-sm leading-relaxed">
          Loading greeting...
        </div>
      </div>
    </div>

    <!-- Input Section -->
    <div class="border-t border-[#e5e7eb] bg-white px-6 py-4">
      <div class="flex gap-3">
        <div class="flex-1">
          <label class="block text-xs font-semibold text-[#6b7280] mb-2">Your Response (as patient)</label>
          <div class="flex gap-2">
            <input
              id="messageInput"
              type="text"
              placeholder="Type your response..."
              class="flex-1 px-4 py-3 border border-[#e5e7eb] rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-[#2563eb]"
            />
            <button
              id="sendBtn"
              class="px-6 py-3 bg-[#2563eb] text-white rounded-lg font-medium hover:bg-[#1d4ed8] transition"
            >
              Send
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="px-6 py-3 bg-[#f0f4f8] border-t border-[#d1d5db] text-xs text-[#6b7280]">
      ✓ HIPAA-Protected • Secure End-to-End • No Real Patient Data
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const ledgerId = params.get('ledgerId');
    let conversationStep = 1;

    if (!ledgerId) {
      document.getElementById('messagesContainer').innerHTML = '<div class="p-4 text-center text-red-600">Error: No ledgerId provided</div>';
    }

    // Load initial greeting
    async function loadInitialGreeting() {
      try {
        const response = await fetch('/api/sms/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ledgerId }),
        });

        if (response.ok) {
          const data = await response.json();
          const initialMessage = document.getElementById('initialMessage');
          if (initialMessage) {
            initialMessage.innerHTML = `<div class="max-w-2xl bg-[#f3f4f6] text-[#1f2937] px-5 py-3 rounded-lg text-sm leading-relaxed whitespace-pre-wrap">${escapeHtml(data.greeting)}</div>`;
          }
        }
      } catch (err) {
        console.error('Error:', err);
      }
    }

    window.addEventListener('load', loadInitialGreeting);

    // Send message
    document.getElementById('sendBtn').addEventListener('click', sendMessage);
    document.getElementById('messageInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const message = input.value.trim();
      if (!message) return;

      const container = document.getElementById('messagesContainer');

      // Show patient message
      const patientDiv = document.createElement('div');
      patientDiv.className = 'flex justify-end';
      patientDiv.innerHTML = `
        <div class="max-w-2xl">
          <div class="text-xs font-semibold text-[#9ca3af] mb-2">Patient Response</div>
          <div class="bg-[#2563eb] text-white px-5 py-3 rounded-lg text-sm">${escapeHtml(message)}</div>
        </div>
      `;
      container.appendChild(patientDiv);

      input.value = '';
      input.disabled = true;
      document.getElementById('sendBtn').disabled = true;

      // Show loading indicator
      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'flex justify-start';
      loadingDiv.innerHTML = `
        <div class="max-w-2xl">
          <div class="text-xs font-semibold text-[#9ca3af] mb-2">AI Agent Response</div>
          <div class="bg-[#f3f4f6] text-[#1f2937] px-5 py-3 rounded-lg text-sm">Processing...</div>
        </div>
      `;
      container.appendChild(loadingDiv);
      container.scrollTop = container.scrollHeight;

      try {
        const response = await fetch('/api/sms/message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            ledgerId,
            message,
            phoneNumber: 'demo-patient',
          }),
        });

        loadingDiv.remove();

        if (response.ok) {
          const data = await response.json();

          const aiDiv = document.createElement('div');
          aiDiv.className = 'flex justify-start';
          aiDiv.innerHTML = `
            <div class="max-w-2xl">
              <div class="text-xs font-semibold text-[#9ca3af] mb-2">AI Agent Response</div>
              <div class="bg-[#f3f4f6] text-[#1f2937] px-5 py-3 rounded-lg text-sm leading-relaxed whitespace-pre-wrap">${escapeHtml(data.aiResponse)}</div>
            </div>
          `;
          container.appendChild(aiDiv);

          conversationStep++;

          // If next step exists, show it
          if (data.nextStep) {
            setTimeout(() => {
              const nextStepDiv = document.createElement('div');
              nextStepDiv.className = 'flex justify-start mt-2';
              nextStepDiv.innerHTML = `
                <div class="max-w-2xl">
                  <div class="text-xs font-semibold text-[#9ca3af] mb-2">Next: ${data.nextStep.replace('_', ' ').toUpperCase()}</div>
                  <div class="text-xs text-[#6b7280] italic">Awaiting patient response...</div>
                </div>
              `;
              container.appendChild(nextStepDiv);
              container.scrollTop = container.scrollHeight;
            }, 800);
          } else {
            setTimeout(() => {
              const completeDiv = document.createElement('div');
              completeDiv.className = 'flex justify-start mt-4';
              completeDiv.innerHTML = `
                <div class="max-w-2xl bg-[#ecfdf5] border border-[#6ee7b7] rounded-lg px-5 py-3">
                  <div class="text-sm font-semibold text-[#065f46]">✓ Intake Complete</div>
                  <div class="text-xs text-[#047857] mt-1">All verification steps completed. Patient ready for check-in.</div>
                </div>
              `;
              container.appendChild(completeDiv);
              container.scrollTop = container.scrollHeight;
            }, 800);
          }
        } else {
          loadingDiv.remove();
          const errorDiv = document.createElement('div');
          errorDiv.className = 'flex justify-start';
          errorDiv.innerHTML = `
            <div class="max-w-2xl bg-[#fef2f2] border border-[#fca5a5] rounded-lg px-5 py-3">
              <div class="text-sm text-[#991b1b]">Error processing response. Please try again.</div>
            </div>
          `;
          container.appendChild(errorDiv);
        }
      } catch (err) {
        loadingDiv.remove();
        const errorDiv = document.createElement('div');
        errorDiv.className = 'flex justify-start';
        errorDiv.innerHTML = `
          <div class="max-w-2xl bg-[#fef2f2] border border-[#fca5a5] rounded-lg px-5 py-3">
            <div class="text-sm text-[#991b1b]">Error: ${err.message}</div>
          </div>
        `;
        container.appendChild(errorDiv);
      } finally {
        input.disabled = false;
        document.getElementById('sendBtn').disabled = false;
        input.focus();
        container.scrollTop = container.scrollHeight;
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
